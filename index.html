<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:linear-gradient(135deg,white);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:450px;
      background:#fff;
      padding:30px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .form-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
      color:#444;
    }

    input, select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
      outline:none;
      transition:0.3s;
    }

    input:focus,
    select:focus{
      border-color:#4facfe;
      box-shadow:0 0 5px rgba(79,172,254,0.5);
    }

    .qr-box{
      text-align:center;
      margin:20px 0;
    }

    .qr-box img{
      width:220px;
      height:220px;
      border:4px solid #eee;
      border-radius:10px;
    }

    .payment-text{
      margin-top:10px;
      font-weight:bold;
      color:#333;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:skyblue;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#008cff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Payment Form</h2>

    <!-- Replace YOUR_FORM_ID with Formspree Form ID -->
    <form action="https://formspree.io/f/mqejgobe" method="POST">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" id="date" name="date" required>
      </div>

      <div class="form-group">
        <label>Contact Number</label>
        <input type="tel" name="contact" placeholder="98XXXXXXXX" required>
      </div>

      <div class="form-group">
        <label>Payment Method</label>
        <select name="payment_method" required>
          <option value="">Select Payment Method</option>
          <option value="Esewa">Esewa</option>
          <option value="Khalti">Khalti</option>
          <option value="IME Pay">IME Pay</option>
          <option value="Bank Transfer">Bank Transfer</option>
        </select>
      </div>

      <div class="form-group">
        <label>Amount (Rs)</label>
        <input type="number" name="amount" placeholder="Enter amount" required>
      </div>

      <!-- QR Code -->
      <div class="qr-box">
        <!-- Replace qr.png with your QR image -->
        <img src="pay.jpeg" alt="QR Code">

        <div class="payment-text">
          Scan QR for Payment
        </div>
      </div>

      <button type="submit">Submit Payment</button>

    </form>
  </div>

  <script>
    // Auto set today's date (editable)
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;
  </script>

</body>
</html>
